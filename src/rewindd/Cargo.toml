[package]
name = "rewindd"
version = "1.0.0"
edition = "2021"
description = "Local desktop time-machine helper for the Rewind Omarchy plugin"
license = "MIT"
publish = false

[lib]
name = "rewindd"
path = "src/lib.rs"

[[bin]]
name = "rewindd"
path = "src/main.rs"

[features]
default = []
wayland = ["dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-wlr", "dep:memmap2"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", optional = true, features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", optional = true, features = ["client"] }
memmap2 = { version = "0.9", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
